name: ANS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ans-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: baseline-and-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up baseline Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install baseline dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Record runtime versions
        run: python -c "import sys, numpy; print(sys.version); print('NumPy', numpy.__version__)"

      - name: Verify frozen v0.4 chain
        run: python freeze_v4.py --verify

      - name: Run regression tests
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Check tracked files remain unchanged
        run: git diff --exit-code --stat HEAD
